<!DOCTYPE html>
<html lang="th">
<head>
  <link rel="icon" type="image/png" href="logo1.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Network Survey - IT UDON HOSP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #d81b60; /* โทนชมพู */
    }
    body {
      font-family: 'Kanit', sans-serif;
      background: linear-gradient(135deg, #fce4ec 0%, #ffffff 100%);
      background-attachment: fixed;
      min-height: 100vh;
      color: #374151;
    }
    /* ลายน้ำ */
    .watermark {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-15deg);
      opacity: 0.03;
      font-size: 8vw;
      font-weight: 700;
      color: var(--primary);
      white-space: nowrap;
      z-index: 0;
      pointer-events: none;
      user-select: none;
    }
    .card {
      background: rgba(255, 255, 255, 0.75); /* ปรับความโปร่งลงเล็กน้อยเพื่อให้ดูละมุนขึ้น */
      backdrop-filter: blur(16px); /* เพิ่มความเบลอให้พื้นหลังดูเนียนตา */
      -webkit-backdrop-filter: blur(16px); /* รองรับ Safari */
      
      /* ปรับความโค้งมนให้สวยงามยิ่งขึ้น */
      border-radius: 1.75rem; 
      
      /* ปรับเงาให้มีความนุ่มและกระจายตัวกว้างขึ้น (Soft Shadow) */
      box-shadow: 0 10px 30px -5px rgba(216, 27, 96, 0.05), 
                  0 20px 40px -15px rgba(0, 0, 0, 0.07);
                  
      /* เส้นขอบสีขาวไล่เฉดบางๆ ช่วยให้ขอบโค้งคมชัดและมีมิติ */
      border: 1px solid rgba(255, 255, 255, 0.6); 
      
      overflow: hidden; /* ป้องกันไม่ให้เนื้อหาข้างในล้นทะลุขอบโค้งออกไป */
    }
    .btn {
      border-radius: 9999px;
      transition: all 0.2s ease-in-out;
    }
    .btn:active {
      transform: scale(0.96);
    }
    /* Loader Overlay */
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      width: 48px;
      height: 48px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    /* พิมพ์แนวนอน */
    @media print {
      @page { size: landscape; margin: 1cm; }
      body { background: white; }
      .no-print { display: none !important; }
      .card { box-shadow: none; border: 1px solid #e5e7eb; }
      .watermark { opacity: 0.05; }
    }
  </style>
</head>
<body class="antialiased">
  
  <div class="watermark">IT UDON HOSP</div>

  <!-- Overlay โหลดข้อมูล -->
  <div id="overlay" class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm z-50 hidden flex-col items-center justify-center no-print">
    <div class="loader mb-4"></div>
    <div id="overlayText" class="text-white font-medium text-lg shadow-black drop-shadow-md">กำลังประมวลผล...</div>
  </div>

  <!-- Custom Modal สำหรับแจ้งเตือน (แทน Alert/Confirm) -->
  <div id="customModal" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-[60] hidden flex-col items-center justify-center no-print">
    <div class="card w-[90%] max-w-sm p-6 text-center transform transition-all scale-95 opacity-0" id="customModalContent">
      <div id="customModalIcon" class="mx-auto w-16 h-16 rounded-full flex items-center justify-center mb-4"></div>
      <h3 id="customModalTitle" class="text-xl font-bold text-gray-800 mb-2">แจ้งเตือน</h3>
      <p id="customModalText" class="text-sm text-gray-600 mb-6"></p>
      <div id="customModalActions" class="flex gap-3 justify-center">
        <!-- Buttons dynamically injected here -->
      </div>
    </div>
  </div>

  <div class="relative z-10 max-w-7xl mx-auto px-4 pb-12 sm:px-6 lg:px-8">
    
    <!-- ส่วนหัว (Header) -->
   <header id="mainHeader" class="hidden py-6 mb-4 border-b border-pink-700/50 no-print flex flex-col md:flex-row justify-between items-center gap-4 bg-gradient-to-br from-pink-500 via-pink-50/50 to-white p-6 rounded-2xl">
    <div class="flex items-center gap-4">
      <div class="w-14 h-14 rounded-full flex items-center justify-center shadow-sm border border-pink-900 overflow-hidden bg-white">
        <img src="./logo1.png" alt="Logo" class="w-full h-full object-cover">
      </div>
      <div>
        <h1 class="text-2xl font-bold text-gray-800 leading-tight">โรงพยาบาลอุดรธานี</h1>
        <p class="text-sm text-pink-600 font-medium tracking-wide">กลุ่มงานเทคโนโลยีสารสนเทศทางการแพทย์</p>
      </div>
    </div>
    <div class="flex items-center gap-4 bg-white/70 px-5 py-2.5 rounded-full shadow-sm border border-pink-50">
      <div class="flex flex-col text-right">
        <span id="displayUserName" class="text-sm font-bold text-gray-800">IT Staff</span>
        <span class="text-[10px] text-gray-500 bg-gray-100 px-2 rounded-full w-fit ml-auto">เจ้าหน้าที่สำรวจ</span>
      </div>
      <div class="h-8 w-px bg-gray-300"></div>
      <button onclick="logout()" class="btn text-pink-600 hover:text-pink-800 hover:bg-pink-50 px-3 py-1.5 text-sm font-medium flex items-center">
        <i class="fas fa-sign-out-alt mr-1.5"></i> ออกจากระบบ
      </button>
    </div>
  </header>

    <!-- พื้นที่แสดงเนื้อหาหลัก -->
    <main id="appContent">
        <!-- Javascript จะทำการ Render หน้าต่างๆ ลงในนี้ -->
    </main>

  </div>

  <script>
    // ==========================================
    // ตั้งค่า URL ของ Web App จาก Google Apps Script
    // ==========================================
    const API_URL = 'https://script.google.com/macros/s/AKfycbxXlztTHdCM1RSKK0gVRHvDVqZR4bE0RiPliDNSane-xhoffM7vMBVj5TAwHieniC0i2g/exec'; // <-- ใส่ Web App URL 
    
    // State ส่วนกลาง
    let currentUser = null;
    
    // DOM Elements
    const overlay = document.getElementById('overlay');
    const overlayText = document.getElementById('overlayText');
    const mainHeader = document.getElementById('mainHeader');
    const appContent = document.getElementById('appContent');
    const displayUserName = document.getElementById('displayUserName');

    // UI Utilities
    function showLoading(text = 'กำลังโหลดข้อมูล...') {
      overlayText.innerText = text;
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
    }
    
    function hideLoading() {
      overlay.classList.add('hidden');
      overlay.classList.remove('flex');
    }

    // Modal Utilities
    function showModal(type, message, onConfirm = null) {
      const modal = document.getElementById('customModal');
      const content = document.getElementById('customModalContent');
      const icon = document.getElementById('customModalIcon');
      const text = document.getElementById('customModalText');
      const actions = document.getElementById('customModalActions');
      
      text.innerText = message;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      
      // Animation
      setTimeout(() => {
        content.classList.remove('scale-95', 'opacity-0');
        content.classList.add('scale-100', 'opacity-100');
      }, 10);

      const closeModal = () => {
        content.classList.remove('scale-100', 'opacity-100');
        content.classList.add('scale-95', 'opacity-0');
        setTimeout(() => {
          modal.classList.add('hidden');
          modal.classList.remove('flex');
        }, 200);
      };

      if (type === 'alert') {
        icon.className = 'mx-auto w-16 h-16 rounded-full flex items-center justify-center mb-4 bg-red-50 text-red-500 text-3xl border border-red-100';
        icon.innerHTML = '<i class="fas fa-exclamation-circle"></i>';
        actions.innerHTML = `<button class="btn bg-gray-800 hover:bg-gray-900 text-white px-6 py-2 rounded-xl text-sm font-medium" id="modalOkBtn">ตกลง</button>`;
        document.getElementById('modalOkBtn').onclick = closeModal;
      } else if (type === 'confirm') {
        icon.className = 'mx-auto w-16 h-16 rounded-full flex items-center justify-center mb-4 bg-blue-50 text-blue-500 text-3xl border border-blue-100';
        icon.innerHTML = '<i class="fas fa-question-circle"></i>';
        actions.innerHTML = `
          <button class="btn bg-gray-100 hover:bg-gray-200 text-gray-700 px-6 py-2 rounded-xl text-sm font-medium border border-gray-200" id="modalCancelBtn">ยกเลิก</button>
          <button class="btn bg-gradient-to-r from-pink-500 to-rose-400 hover:from-pink-600 hover:to-rose-500 text-white px-6 py-2 rounded-xl text-sm font-medium shadow-md" id="modalConfirmBtn">ยืนยัน</button>
        `;
        document.getElementById('modalCancelBtn').onclick = closeModal;
        document.getElementById('modalConfirmBtn').onclick = () => {
          closeModal();
          if(onConfirm) onConfirm();
        };
      }
    }

    function showAlert(msg) { showModal('alert', msg); }
    function showConfirm(msg, callback) { showModal('confirm', msg, callback); }

    // ==========================================
    // Session & Auth Logic
    // ==========================================
    function checkSession() {
      const sessionData = localStorage.getItem('it_udon_survey_session');
      if (sessionData) {
        currentUser = JSON.parse(sessionData);
        displayUserName.innerText = currentUser.name || currentUser.username;
        mainHeader.classList.remove('hidden');
        renderDashboard(); // ถ้ามี Session ให้ไปหน้า Dashboard เสมอ
      } else {
        mainHeader.classList.add('hidden');
        renderLogin(); // ถ้าไม่มีให้เด้งกลับหน้า Login
      }
    }

    function logout() {
      showLoading('กำลังออกจากระบบ...');
      setTimeout(() => {
        localStorage.removeItem('it_udon_survey_session');
        currentUser = null;
        hideLoading();
        checkSession();
      }, 500);
    }

    // ==========================================
    // Render: หน้า Login
    // ==========================================
    function renderLogin() {
      appContent.innerHTML = `
      <div class="flex items-center justify-center min-h-[85vh]">
          <div class="card w-full max-w-sm p-8 text-center border-t-4 border-t-pink-500">
              <div class="mx-auto w-20 h-20 bg-pink-50 rounded-full flex items-center justify-center text-pink-600 mb-4 border border-pink-100 shadow-inner">
                  <i class="fas fa-user-shield text-3xl"></i>
              </div>
              <h2 class="text-xl font-bold text-gray-800 mb-1">เข้าสู่ระบบสำรวจ</h2>
              <p class="text-xs text-gray-500 mb-6 font-medium">โครงสร้างพื้นฐานระบบเครือข่าย</p>
              
              <form onsubmit="handleLogin(event)" class="space-y-4">
                  <div class="relative">
                      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                          <i class="fas fa-user text-gray-400 text-sm"></i>
                      </div>
                      <input type="text" id="username" required placeholder="รหัสเจ้าหน้าที่" 
                             class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-pink-300 focus:border-transparent bg-white">
                  </div>
                  <div class="relative">
                      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                          <i class="fas fa-lock text-gray-400 text-sm"></i>
                      </div>
                      <input type="password" id="password" required placeholder="รหัสผ่าน" 
                             class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-pink-300 focus:border-transparent bg-white">
                  </div>
                  <button type="submit" class="btn w-full bg-gradient-to-r from-pink-500 to-rose-400 hover:from-pink-600 hover:to-rose-500 text-white font-medium py-3 rounded-xl shadow-md text-sm mt-2">
                      เข้าสู่ระบบ
                  </button>
              </form>
          </div>
      </div>`;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      
      showLoading('กำลังตรวจสอบข้อมูลการเข้าสู่ระบบ...');
      try {
          const res = await callAPI({ action: 'login', username: u, password: p });
          if (res.status === 'success') {
              localStorage.setItem('it_udon_survey_session', JSON.stringify(res.data));
              checkSession();
          } else {
              showAlert('ข้อมูลเข้าสู่ระบบไม่ถูกต้อง หรือไม่พบสิทธิ์การใช้งาน');
          }
      } catch (err) {
          showAlert('เกิดข้อผิดพลาดในการเชื่อมต่อกับเซิร์ฟเวอร์');
          console.error(err);
      }
      hideLoading();
    }

    // ==========================================
    // Render: Tabs Menu
    // ==========================================
    function renderTabs(active) {
      return `
      <div class="flex space-x-2 mb-6 no-print bg-white/50 p-1.5 rounded-2xl w-fit mx-auto md:mx-0 shadow-sm border border-pink-100 backdrop-blur-sm">
          <button onclick="renderDashboard()" class="px-5 py-2.5 rounded-xl text-sm font-medium transition-all ${active === 'dashboard' ? 'bg-white text-pink-600 shadow-sm' : 'text-gray-600 hover:bg-white/60'}">
              <i class="fas fa-chart-pie mr-1.5"></i> Dashboard
          </button>
          <button onclick="renderSurveyList()" class="px-5 py-2.5 rounded-xl text-sm font-medium transition-all ${active === 'surveylist' ? 'bg-white text-pink-600 shadow-sm' : 'text-gray-600 hover:bg-white/60'}">
              <i class="fas fa-clipboard-list mr-1.5"></i> รายการสำรวจ (Survey List)
          </button>
      </div>
      `;
    }

    // ==========================================
    // Render: หน้า Dashboard
    // ==========================================
    async function renderDashboard() {
      if(!currentUser) return checkSession();
      appContent.innerHTML = renderTabs('dashboard') + `<div id="dashboardContent" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>`;
      
      showLoading('กำลังโหลด Dashboard...');
      try {
          const res = await callAPI({action: 'getDashboard'});
          if(res.status === 'success') {
              const data = res.data;
              const container = document.getElementById('dashboardContent');
              let html = '';
              for(const [type, count] of Object.entries(data)) {
                  html += `
                  <div class="card p-5 border-l-4 border-pink-400 hover:shadow-md transition-shadow">
                      <p class="text-xs text-gray-500 font-semibold mb-1 uppercase tracking-wider">${type || 'ไม่ระบุ'}</p>
                      <h3 class="text-3xl font-bold text-gray-800">${count} <span class="text-sm font-normal text-gray-400">จุดติดตั้ง</span></h3>
                  </div>`;
              }
              if(Object.keys(data).length === 0) html = '<div class="col-span-full card p-8 text-center text-gray-500">ยังไม่มีข้อมูลจุดติดตั้ง</div>';
              container.innerHTML = html;
          }
      } catch(err) { console.error(err); }
      hideLoading();
    }

    // ==========================================
    // Render: หน้า SurveyList
    // ==========================================
   async function renderSurveyList() {
      if(!currentUser) return checkSession();
      appContent.innerHTML = renderTabs('surveylist') + `<div id="surveyListContent" class="space-y-6"></div>`;
      
      showLoading('กำลังดึงข้อมูลรายการสำรวจทั้งหมด...');
      try {
          const res = await callAPI({action: 'getSurveyList'});
          if(res.status === 'success') {
              const rooms = res.data || [];
              
              // ---------------------------------------------------------
              // 1. จัดกลุ่มแบบ 2 ชั้น: อาคาร (R.LOCAT) -> ชั้น (R.LOF)
              // ---------------------------------------------------------
              const grouped = {};
              rooms.forEach(r => {
                  const loc = r['R.LOCAT'] || 'ไม่ระบุสถานที่';
                  const floor = r['R.LOF'] || 'ไม่ระบุชั้น';
                  
                  if(!grouped[loc]) grouped[loc] = {};
                  if(!grouped[loc][floor]) grouped[loc][floor] = [];
                  
                  grouped[loc][floor].push(r);
              });
              
              let html = '';
              
              // เรียงลำดับชื่ออาคาร/สถานที่ตามตัวอักษร
              const sortedLocs = Object.keys(grouped).sort();
              
              sortedLocs.forEach(loc => {
                  html += `
                  <div class="card p-6 border border-gray-100 shadow-sm bg-white rounded-2xl mb-6">
                      <h3 class="text-xl font-bold text-gray-800 border-b border-gray-100 pb-3 mb-5 flex items-center">
                          <i class="fas fa-building text-pink-500 mr-2 bg-pink-50 p-2 rounded-xl"></i> อาคาร/สถานที่: ${loc}
                      </h3>
                      <div class="space-y-8">
                  `;
                  
                  // ---------------------------------------------------------
                  // 2. เรียงลำดับชั้น (รองรับทั้งตัวเลขและข้อความ เช่น ชั้น 1, ชั้น 2, ชั้น 10)
                  // ---------------------------------------------------------
                  const sortedFloors = Object.keys(grouped[loc]).sort((a, b) => {
                      return a.toString().localeCompare(b.toString(), undefined, {numeric: true, sensitivity: 'base'});
                  });
                  
                  sortedFloors.forEach(floor => {
                      html += `
                      <div class="floor-section">
                          <h4 class="text-xs font-bold text-gray-500 mb-3.5 flex items-center bg-gray-50 border border-gray-200/60 w-fit px-2.5 py-1 rounded-lg tracking-wide">
                              <i class="fas fa-layer-group text-pink-400 mr-1.5"></i> ชั้น: ${floor}
                          </h4>
                          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                      `;
                      
                      // เรียงลำดับชื่อห้องภายในชั้น (RNAME) ให้ไล่โค้ด/หาห้องง่ายขึ้น
                      grouped[loc][floor].sort((a, b) => {
                          const nameA = a['RNAME'] || '';
                          const nameB = b['RNAME'] || '';
                          return nameA.toString().localeCompare(nameB.toString());
                      });
                      
                      grouped[loc][floor].forEach(r => {
                          const isSurveyed = r.surveyCount > 0;
                          const statusColor = isSurveyed ? 'text-green-600 bg-green-50 border-green-200' : 'text-orange-500 bg-orange-50 border-orange-200';
                          const statusIcon = isSurveyed ? 'fa-check-circle' : 'fa-hourglass-half';
                          const statusText = isSurveyed ? 'สำรวจแล้ว' : 'ยังไม่สำรวจ';
                          
                          const typColor = getHashColor(r['ROOMTYP']);
                          const titleText = `${r['RNAME'] || '-'} / ${r['R.LOCAT'] || ''} / ชั้น ${r['R.LOF'] || '-'}`;
                          
                          // ดึงข้อมูลรูปภาพหน้าปก Card
                          const fileId = getColValue(r, 11);
                          const imgUrl = fileId ? `https://drive.google.com/thumbnail?id=${fileId}&sz=w600` : 'https://placehold.co/400x200/fce4ec/d81b60?text=No+Image';
                          
                          html += `
                          <div class="border border-gray-200 rounded-xl hover:shadow-lg transition-all cursor-pointer bg-white relative overflow-hidden group flex flex-col" onclick="renderRoomDetail('${r['ROOMID']}')">
                              
                              <div class="h-32 w-full bg-gray-100 relative overflow-hidden border-b border-gray-100">
                                   <img src="${imgUrl}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" onerror="this.src='https://placehold.co/400x200/fce4ec/d81b60?text=NO IMAGE'">
                                   <div class="absolute top-0 left-0 w-1.5 h-full z-10" style="background-color: ${typColor}"></div>
                                   
                                   <div class="absolute top-2 right-2">
                                       <span class="text-[10px] font-bold px-2.5 py-1 rounded-md shadow-sm flex items-center gap-1.5 ${statusColor} bg-white/90 backdrop-blur-sm border-none">
                                           <i class="fas ${statusIcon}"></i> ${statusText}
                                       </span>
                                   </div>
                              </div>
                              
                              <div class="p-4 flex-1 flex flex-col">
                                  <span class="text-[10px] font-bold px-2 py-0.5 rounded-md uppercase tracking-wider w-fit mb-2" style="background-color: ${typColor}15; color: ${typColor}">
                                      ${r['ROOMTYP'] || 'ไม่ระบุประเภท'}
                                  </span>
                                  
                                  <h4 class="font-medium text-gray-800 mb-3 leading-snug line-clamp-2 text-sm">${titleText}</h4>
                                  
                                  <div class="flex gap-2 text-xs text-gray-500 mt-auto">
                                      <div class="bg-gray-50 px-2 py-1.5 rounded-lg flex-1 text-center border border-gray-100">
                                          <span class="block text-[9px] text-gray-400 uppercase">Criticality</span>
                                          <span class="font-bold text-gray-700">${r['Criticality_Level'] || '-'}</span>
                                      </div>
                                      <div class="bg-gray-50 px-2 py-1.5 rounded-lg flex-1 text-center border border-gray-100">
                                          <span class="block text-[9px] text-gray-400 uppercase">Risk Level</span>
                                          <span class="font-bold text-gray-700">${r['Rick_Level'] || '-'}</span>
                                      </div>
                                  </div>
                              </div>
                          </div>
                          `;
                      });
                      
                      html += `</div></div>`; // ปิดโครงสร้างของ Grid และ Floor Section
                  });
                  
                  html += `</div></div>`; // ปิดโครงสร้างของอาคารแต่ละแห่ง
              });
              
              document.getElementById('surveyListContent').innerHTML = html || '<div class="card p-8 text-center text-gray-500">ไม่พบรายการห้อง</div>';
          }
      } catch(err) { console.error(err); }
      hideLoading();
}

    // ==========================================
    // Render: หน้า Room Detail
    // ==========================================
   async function renderRoomDetail(roomId) {
      if(!currentUser) return checkSession();

    // ==========================================
    // Utilities Support
    // ==========================================
    function getHashColor(str) {
      const colors = ['#e91e63', '#9c27b0', '#5c6bc0', '#00acc1', '#00897b', '#f4511e', '#e53935'];
      if(!str) return '#9e9e9e';
      let hash = 0;
      for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
      return colors[Math.abs(hash) % colors.length];
    }

    // ฟังก์ชันช่วยดึงค่าจาก Object ตามลำดับ Index (A=0, B=1, C=2, ..., L=11)
    function getColValue(obj, colIndex) {
      if (!obj) return '';
      const values = Object.values(obj);
      return values[colIndex] !== undefined && values[colIndex] !== null ? values[colIndex] : '';
    }

    // Wrapper สำหรับเรียก Google Apps Script ด้วย POST text/plain เพื่อแก้ปัญหา CORS
    async function callAPI(payload) {
      if(API_URL.includes('YOUR_APPS_SCRIPT_WEB_APP_URL') || !API_URL) {
          showAlert("กรุณาใส่ URL ของ Web App ในบรรทัดที่ 90 ของโค้ด HTML");
          throw new Error("No API URL");
      }
      
      // การใช้ text/plain จะข้ามผ่าน Preflight request (OPTIONS) ของเบราว์เซอร์
      const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
      });
      return await response.json();
    }
